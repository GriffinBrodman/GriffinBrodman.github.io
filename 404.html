      <p class="eyebrow"><span class="dot" aria-hidden="true"></span>404 · Lost in the pond</p>
      <h1>Confess your sins to the Helix Fossil.</h1>
      <form class="confess" id="confess" novalidate>
        <label for="confession">Your confession</label>
        <textarea id="confession" name="confession" rows="4" placeholder="I clicked a broken link…"></textarea>
        <div class="confess-row">
          <button type="submit" class="btn btn-primary">Confess</button>
          <a class="home-link" href="/">Skip the confession and go home</a>
        </div>
      </form>
      <div class="forgiven" id="forgiven" hidden tabindex="-1">
        <p>The Helix Fossil has forgiven you.</p>
        <a class="btn btn-primary" href="/">Return home</a>
      </div>
    </div>
  </main>
  <script>
    // Nothing is sent anywhere: the fossil listens, forgives, and forgets.
    (function () {
      var form = document.getElementById('confess');
      var done = document.getElementById('forgiven');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        form.reset();
        form.hidden = true;
        done.hidden = false;
        document.getElementById('shrine').classList.add('is-forgiven');
        done.focus();
      });
    })();
  </script>
</body>
</html>

<title>Dungeon Map Mock-ups</title><style>
body{margin:0;background:#1d150e;color:#eedfc2;font:16px/1.5 Georgia,serif}main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}

<p>The four directions picked from the first round, drawn in more detail. Each sheet shows the same dungeon (the burrows under Goblin Camp) on days 2, 6 and 9 of a league, plus how it looks on a phone.</p>
<figure><img src="6_wall_inked.png" alt="The guild wall map" loading="lazy"><figcaption>6. The guild wall map <span>— the burrows inked on a board in the hall where the heroes drink</span></figcaption></figure>
<figure><img src="3_wall_cutaway.png" alt="The guild wall cutaway" loading="lazy"><figcaption>3. The guild wall cutaway <span>— both floors painted as an isometric model on the same wall</span></figcaption></figure>
<figure><img src="2_parchment.png" alt="Hand-inked parchment" loading="lazy"><figcaption>2. Hand-inked parchment <span>— the maps the heroes draw themselves, from a scrawled sketch to the mapmaker's fair copy</span></figcaption></figure>
<figure><img src="2-4_annotated_parchment.png" alt="Annotated parchment" loading="lazy"><figcaption>2+4. Annotated parchment <span>— the fair copy with the full key: who lives where, traps, loot, and who cleared what and when</span></figcaption></figure>

<!doctype html><html><head><meta charset="utf-8"><title>Artboard</title>
<style>body{background:#241a2e;margin:8px;font:12px monospace;color:#ddd}canvas{image-rendering:pixelated;margin:2px;vertical-align:bottom}.row{margin-bottom:6px}</style>
</head><body>
<script src="../data/static.js"></script><script src="../js/art.js"></script><script src="../js/paint.js"></script><script src="../js/beasts.js"></script>
<script>
const S = window.LD.static;
const classes = Object.keys(S.classes);
const skins=["#f6d5b8","#e8b088","#c98e62","#a06a42","#6e4428","#4a2e1c","#9cc48a","#a7b4d8"];
const hairs=["#1c1a1f","#4b2e1e","#7a4424","#c46a2c","#e0b45a","#efe2c0","#9a9aa6","#e478b4","#4f7fe0","#4caf6a"];
const favs=["#c8323c","#e8823a","#e8c83a","#4caf50","#2f9e9e","#3c64c8","#7a4cc8","#d860a8","#2b2b33","#e8e8e8"];
const weapons={warrior:"sword",ranger:"bow",mage:"staff"};
const fams=["sword","axe","mace","daggers","spear","bow","crossbow","staff","wand","lute","frying_pan"];
const scarsets=[[],[],["eyepatch"],["scar"],["hook"],["peg"],["burn"],["pale"]];
let row=document.createElement('div');row.className='row';document.body.appendChild(row);
classes.forEach((c,i)=>{
  const h={look:{skin:skins[i%8],hair:hairs[i%10],style:i%8,face:i%4,fav:favs[i%10],scars:scarsets[i%8]},weapon:fams[i%fams.length],weapon_tier:1+(i%5),armor_tier:1+(i%5),legend:i===5};
  const cv=Art.heroCanvas(h,4,0,S.classes[c]); cv.title=c; row.appendChild(cv);
  if((i+1)%22===0){row=document.createElement('div');row.className='row';document.body.appendChild(row);}
});
row=document.createElement('div');row.className='row';document.body.appendChild(row);
Object.entries(S.monsters).forEach(([k,m],i)=>{const cv=Art.monsterGrid(m,0).toCanvas(3);cv.title=k;row.appendChild(cv);});
row=document.createElement('div');row.className='row';document.body.appendChild(row);
for(const k of ["dog","cat","lizard"]) for(const n of ["Biscuit","Mittens","Toast"]) row.appendChild(Art.petGrid({kind:k,name:n},0).toCanvas(4));
for(const e of ["sword","skull","star","paw","tree","moon","flame","crown","eye","coin"]) row.appendChild(Art.bannerGrid({c1:favs[e.length%10],c2:favs[(e.length+3)%10],emblem:e}).toCanvas(3));
row.appendChild(Art.graveGrid().toCanvas(4));
for(const it of Object.keys(S.goods)) row.appendChild(Art.itemGrid(it).toCanvas(4));
</script></body></html>
